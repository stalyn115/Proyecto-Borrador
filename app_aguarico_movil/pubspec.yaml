name: app_aguarico_movil
description: App móvil para Agrupación Aguarico - Sistema de Gestión v6
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  # HTTP y estado
  http: ^1.2.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  # Escaneo QR con cámara
  mobile_scanner: ^5.2.3
  # UI
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
