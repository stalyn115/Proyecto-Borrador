name: app_aguarico_movil
description: "App móvil para Agrupación Aguarico - Gestión, GPS, Seguridad y Asistencia"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  geolocator: ^11.0.0
  url_launcher: ^6.2.5
  audioplayers: ^5.2.1
  mobile_scanner: ^5.2.3
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
